# 公开平台规格; 复制为同目录的 genio_720.local.yaml 后填写真实地址和路径.
id: genio_720
name: MediaTek Genio 720 EVK
soc: MT8189
board_host: ""
board_root: ""
board_open_models_root: ""
board_datasets_root: ""
board_modelzoo_root: ""
os: Rity Demo 26.0-release
kernel: 6.6.137-mtk+ga246e0c68c39-g429091ed5965
npu: MDLA 5.3
neuron_runtime: 8.2.16
onnx_runtime: 1.20.2
llm_cmdline_tool: /usr/sbin/llm_cmdline_tool

# G720 对应的一套编译工具链,环境配置统一从此处读取.
toolchain:
  root: ""
  container_name: ""
  id: neuropilot_8_0_11
  python: "3.11"
  neuropilot_sdk: 8.0.11
  mtk_converter: 8.16.0
  mtk_quantization: 8.2.1
  neuron_compiler: 8.2.31
  # 主机与容器共用相同 SDK 目录.
  sdk_root: ""
  # 主机已有的 C++ 资源,在容器中按相同绝对路径挂载或准备.
  cpp_toolchain_root: ""
  # 主机与容器使用公共目录中的交叉编译器.
  cross_cxx: ""
  # 镜像构建使用的本地 LLM SDK wheel 目录,不含模型权重.
  gai_sdk_root: ""
  # 保留旧版模型使用的独立导出及 TensorFlow 环境配置.
  gai_python: ""
  llm_python: ""
  yamnet_python: ""
