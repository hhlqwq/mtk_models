# deepseek_r1_distill_qwen_1_5b 模型参数,SDK 和 Python 环境由公共平台配置提供.
model:
  # 离线官方资源目录,相对于外部模型资源目录.
  source: original
  output_dir: .
data:
  dataset_dir: .
  mmlu_test: mmlu/all/test-00000-of-00001.parquet
  wikitext_test: wikitext/wikitext-2-raw-v1/test-00000-of-00001.parquet
board:
  deploy_dir: deepseek_r1_distill_qwen_1_5b
  dataset_dir: .
  results_dir: results
conversion:
  context: 1024
  max_new_tokens: 512
native:
  # W4A16 校准、量化和双静态图集中到 build/native.
  work_dir: build/native
  prefill: 128
  calibration_batches: 48
  # 训练文本段数,每段 256 Token,另保留 8 条双语输入;每条对应两个校准批次.
  calibration_train_samples: 16
  mask_value: -10000
  rotate: false
  # 只支持全 W4A16,不通过提高权重位宽替代误差排查.
  attention_precision: asym4W_sym16A
  mlp_precision: asym4W_sym16A
  tail_precision: asym4W_sym16A
  weight_optimization: hessian
  weight_opt_config: deploy/host/hessian_stable.json
  calibration_train: wikitext/wikitext-2-raw-v1/train-00000-of-00001.parquet
evaluation:
  reference_device: cuda
