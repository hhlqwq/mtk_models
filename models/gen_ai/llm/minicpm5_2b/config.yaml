# minicpm5_2b 模型参数,SDK 和 Python 环境由公共平台配置提供.
model:
  # 离线官方资源目录,相对于外部模型资源目录.
  source: original
  output_dir: .
data:
  dataset_dir: .
  # 相对于 dataset_dir,运行前准备固定版本的离线文件,不自动下载.
  wikitext_test: wikitext/wikitext-2-raw-v1/test-00000-of-00001.parquet
  mmlu_test: mmlu/all/test-00000-of-00001.parquet
board:
  deploy_dir: minicpm5_2b
  dataset_dir: .
  results_dir: results
conversion:
  # 约定题集超限时按入口报告增大上下文并另行转换,禁止截题或丢题.
  context: 1024
  max_new_tokens: 512
native:
  # 转换中间文件集中到 build/native,校准、量化和静态图导出由 convert.py 完成.
  work_dir: build/native
  prefill: 128
  calibration_batches: 32
  mask_value: -100
  rotate: false
  # 只支持全 W4A16,不通过提高权重位宽替代误差排查.
  attention_precision: asym4W_sym16A
  mlp_precision: asym4W_sym16A
  tail_precision: asym4W_sym16A
  weight_optimization: none
  weight_opt_config: ''
  calibration_train: ''
evaluation:
  # 正式 MMLU 固定 1000 题,覆盖 57 学科;WikiText2 仍使用完整 test.
  mmlu_questions: 1000
  mmlu_seed: 17
  # 子集用于快速精度损失检查,与正式全量报告分开保存.
  test_mmlu_questions: 100
  test_wikitext_blocks: 16
  reference_device: cuda
