# yolov5s 模型参数.公共 SDK、编译器和板端地址由 Docker 环境加载.
model:
  # 相对于外部模型资源目录的官方原始权重.
  weights: yolov5s.pt
  # 最终模型保存在此处,中间文件集中到 build.
  output_dir: .
  source_archive: yolov5-485da42.zip
  patch_archive: model_conversion_YOLOv5s_example_20240916.zip
data:
  # 相对于本地 dataset_root 的评测数据集.
  dataset_dir: coco/coco_val2017
  # 校准路径相对于 dataset_root,快速评测不改变此配置.
  calibration_dir: coco/coco_val2017/images
  calibration_samples: 100
board:
  # 相对于公共板端部署根目录和数据集根目录.
  deploy_dir: yolov5s
  dataset_dir: coco/val2017
  results_dir: results
