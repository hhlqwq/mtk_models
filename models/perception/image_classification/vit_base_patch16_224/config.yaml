# vit_base_patch16_224 模型参数.公共 SDK、编译器和板端地址由 Docker 环境加载.
model:
  # 相对于外部模型资源目录的官方原始权重.
  weights: original/vit_b_16-c867db91.pth
  # 最终模型保存在此处,中间文件集中到 build.
  output_dir: .
data:
  # 相对于本地 dataset_root 的评测数据集.
  dataset_dir: ImageNet
  # 校准路径相对于 dataset_root,快速评测不改变此配置.
  calibration_dir: ImageNet/ILSVRC2012_img_val
  calibration_samples: 100
  calibration_offset: 1000
board:
  # 相对于公共板端部署根目录和数据集根目录.
  deploy_dir: vit_base_patch16_224
  dataset_dir: ImageNet
  results_dir: results
