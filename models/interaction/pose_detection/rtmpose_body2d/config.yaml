# rtmpose_body2d 模型参数.公共 SDK、编译器和板端地址由 Docker 环境加载.
model:
  # 相对于外部模型资源目录的官方原始权重.
  weights: original/rtmpose-m_simcc-coco-wholebody_pt-aic-coco_270e-256x192-cd5e845c_20230123.pth
  # 最终模型保存在此处,中间文件集中到 build.
  output_dir: .
  upstream_config: configs/wholebody_2d_keypoint/rtmpose/coco-wholebody/rtmpose-m_8xb64-270e_coco-wholebody-256x192.py
data:
  # 相对于本地 dataset_root 的评测数据集.
  dataset_dir: coco/coco_val2017
  # 校准路径相对于 dataset_root,快速评测不改变此配置.
  calibration_dir: coco/coco_val2017/images
  calibration_samples: 100
  calibration_annotations: coco/coco_val2017/annotations/coco_wholebody_val_v1.0.json
board:
  # 相对于公共板端部署根目录和数据集根目录.
  deploy_dir: rtmpose_body2d
  dataset_dir: coco/val2017
  results_dir: results
